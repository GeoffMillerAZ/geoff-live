  <!-- One HTML file serves every route (404.html is a byte-copy of this file),
       so the static canonical above is only correct for "/". On a hard load of
       a deep route, point it at that route instead. The origin is pinned to
       geoffmiller.cloud so the dev mirror never competes for the live URL.
       Initial load only — client-side navigation does not re-run this. -->
  <!-- Per-route canonical. Every route serves this same file, so a static
       canonical would have all 8 sitemap URLs declaring "/" as their canonical
       and Google would drop 7 of them. This rewrites canonical + og:url to the
       real path on a hard load. The origin is pinned to geoffmiller.cloud on
       purpose: dev.geoffmiller.cloud serves an identical bundle, and pinning
       makes the dev mirror point at live rather than compete with it.
       Initial load only — client-side navigation does not re-run it, which is
       fine because crawlers arrive by hard load. Delete this and you must also
       trim the sitemap to just "/". -->
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      if (!path) return;
      var url = "https://geoffmiller.cloud" + path;
      var link = document.querySelector('link[rel="canonical"]');
      if (link) link.setAttribute("href", url);
      var og = document.querySelector('meta[property="og:url"]');
      if (og) og.setAttribute("content", url);
    })();
  </script>
